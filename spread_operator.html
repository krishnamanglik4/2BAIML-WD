<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Operator</title>
</head>
<body>
    <h1>Spread Operator</h1>
</body>
<script>

    function sum(...value){
        let sum = 0 ;
        for(let i in value){
            sum = sum + parseInt(value[i]);
        }
        console.log(sum);
    };

    let arr = [];
    for(let i = 0 ; i < 5 ; i++){
        arr[i] = prompt("Enter Elements");
    }
    sum(...arr);
    
    var a1 = [10,20,30];
    var a2 = [40,50];
    var a3 = [...a1 , ...a2];
    var a4 = [60,...a1,70,...a2];
    console.log(a3);
    console.log(a4);
    
    
    
</script>
</html>
