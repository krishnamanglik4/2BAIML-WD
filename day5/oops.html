<body>
    <h1>OOPS IN JS</h1>
</body>
<script>
    class Student {
        constructor(n, r) {
            this.name = n;
            this.roll = r;
        }

        display() {
            console.log(this.name);
            console.log(this.roll);
        }

        hello() {
            console.log("Hello Sir");
        }
    }

    let s1 = new Student("krishna", 101);
    s1.display();
    s1.hello();   
</script>
