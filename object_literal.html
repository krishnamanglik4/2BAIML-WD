<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Literal</title>
</head>
<body>
    <h1>Object Literal</h1>
</body>
<script>
    let name = "Krishna";
    let roll = 101;
    let data = {
        name,
        roll
    }
    console.log(data.name);
    console.log(data.roll);
    
    
</script>
</html>
