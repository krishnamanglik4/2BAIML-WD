<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: rgb(73, 168, 227);
            
        }
        h1{
            margin-left: 34%;
            margin-top: 50px;
        }
        .btn{
            margin-top: 80px;
            margin-left: 44%;
            height:50px;
            width:200px;
            padding:5;
            border:3px solid black;
            font-size: larger;
            

        }
    </style>
    <script>
        function sum(){
            let age = parseInt(prompt("Enter your age"));
            if(age>=18){
                let c = confirm("do u want to submit your detail");
                if(c){
                    alert("Your response is submitted");
                }
                else {
                    alert("Thank you!");
                }
            }
            else{
                alert("You are not eligible");
            }

            
            
        }
    </script>
</head>
<body>
    <h1 >TO CHECK YOU ARE ABLE TO VOTE</h1>
    <input class="btn" type="button" onclick="sum()" value="Check Eligibility">

</body>
</html>
