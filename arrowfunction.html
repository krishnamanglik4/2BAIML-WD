    <title>Arrow Function</title>
</head>
<body>
    <h1>Arrow Function</h1>
</body>
<script>
    const add = (a, b) => {
    return a + b;
};

physics = (marks) =>{ return `${marks}`};
    
const pattern = (n) => {
    for (let i = 1; i <= n; i++) {
        console.log("* ".repeat(i));
    }
};

pattern(3);

console.log(add(2, 3));
console.log(physics(50));

</script>
